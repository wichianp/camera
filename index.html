<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Camera App</title>

<style>

body{
  font-family:sans-serif;
  text-align:center;
  padding:20px;
}

video,canvas{
  width:100%;
  max-width:400px;
  border-radius:10px;
}

button{
  padding:12px 20px;
  margin:10px;
  font-size:18px;
}

</style>

</head>

<body>

<h2>Camera Capture</h2>
<p id="status"></p>
<input
  type="text"
  id="name"
  placeholder="ชื่อ">

<br><br>

<video
  id="video"
  autoplay
  playsinline>
</video>

<br>

<button id="startBtn">
เปิดกล้อง
</button>

<button onclick="capture()">
ถ่ายรูป
</button>

<canvas
  id="canvas"
  style="display:none;">
</canvas>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbz7_Oc6a35d_DRIjmuO6iZF3_h2ZN5pgumhdQpmNiBg7AMjaphiqzayU3uEJ8tY_htX/exec";

  
  const nameInput = document.getElementById('name');
  const video = document.getElementById('video');
  const startBtn = document.getElementById('startBtn');
  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');

  // แก้ไขฟังก์ชันเปิดกล้องให้ "เคลียร์" สิทธิ์เก่าก่อน
startBtn.onclick = async () => {
  status.innerText = "กำลังตรวจสอบสิทธิ์...";
  if(!nameInput){
    status.innerText = "กรอกชื่อก่อน!";
    return;
  }
  
  // ตรวจสอบว่า Browser รองรับหรือไม่
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.innerText = "Browser นี้ไม่รองรับการเข้าถึงกล้อง";
    return;
  }

  try {
    // บังคับหยุด Stream เดิมถ้ามี
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
    }

    const constraints = { 
      video: { 
        width: { ideal: 1280 },
        height: { ideal: 720 },
        facingMode: "user" 
      } 
    };

    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    video.onloadedmetadata = () => {
        video.play();
        startBtn.disabled = true;
        snapBtn.disabled = false;
        status.innerText = "เชื่อมต่อกล้องสำเร็จ!";
    };
  } catch (err) {
    console.error("Detailed Error:", err);
    // ถ้าเจอ Permission denied ทั้งที่ Allow แล้ว อาจเป็นเพราะมีแอปอื่นใช้กล้องอยู่
    status.innerText = "Error: " + err.name + " - " + err.message;
    if(err.name === 'NotReadableError' || err.name === 'TrackStartError') {
       status.innerText = "ผิดพลาด: กล้องถูกใช้งานโดยโปรแกรมอื่นอยู่ (เช่น Zoom หรือ Line)";
    }
  }
};

async function capture(){

  const canvas =
    document.getElementById("canvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0
  );

  const image =
    canvas.toDataURL("image/png");

  const name =
    document.getElementById("name").value;

  //-----------------------------------
  // SEND TO GAS
  //-----------------------------------

  const res =
    await fetch(GAS_URL,{

      method:"POST",

      body:JSON.stringify({
        name:name,
        image:image
      })

    });

  const data =
    await res.json();

  console.log(data);

  alert("บันทึกสำเร็จ");

}

</script>

</body>
</html>
